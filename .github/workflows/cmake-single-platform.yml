# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
    # Documentation builds nothing and tests nothing, so a change to only these paths does not run CI (plan ci-skip-docs-only,
    # #40). A run starts unless every changed path matches, so a path that is not named here runs CI. README.md is not named on
    # purpose: test_cmake_floor reads it. test_ci_paths holds this list, which must be the same under pull_request and in
    # clang-tidy.yml.
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
  # Manual trigger: a cache can only be measured by a second run on an unchanged tree, and that should not cost a
  # junk commit (plan ci-cache).
  workflow_dispatch:

env:
  # CI's platform is Linux on x86_64, built as Release. The preset (CMakePresets.json) names the tree,
  # build/release-linux-x86_64, and sets its build type; a runner of another architecture fails at the
  # Configure step, and the build-tree guard in CMakeLists.txt says which preset to use (plan platform-build-dirs).
  PRESET: release-linux-x86_64
  # How much ccache may keep. Every run saves a snapshot of its directory (the commit is in the cache key below), so this
  # bounds what a run uploads and what the repository's 10 GB is divided by (plan ci-cache, D5).
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    # The configure, build and test commands are the same on any platform, through the presets.
    # You can convert this to a matrix build if you need cross-platform coverage: one preset per leg.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # libcurl4-openssl-dev only suggests the other two on Ubuntu, so all three are named. ccache comes from plan ci-cache.
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev ccache

    # Which CMake and which compiler the runner has. The floor (CMake 4.0) and the standard (C++23) of plan cmake4-cxx23 are only
    # as good as the image, so the log says what ran before Configure, which stops on either. The same two versions are the
    # toolchain in the cache keys below: a compile cached by another compiler must not be reused, and ubuntu-latest hands out
    # more than one CMake in the same afternoon (4.4.4 and 4.4.5 on 2026-11-04).
    - name: Tool versions
      id: toolchain
      run: |
        cmake --version | head -1
        c++ --version | head -1
        echo "id=$(c++ -dumpfullversion)-$(cmake --version | head -1 | tr ' ' '_')" >> "$GITHUB_OUTPUT"

    # Cache the FetchContent trees: build/release-linux-x86_64/_deps holds the cloned sources and the dependencies' build
    # outputs. A hit removes the seven git clones, which are most of Configure (nlohmann_json's full history alone takes
    # 15 of its 25 s), and the dependencies' compiles.
    #
    # Two things set it apart from a plain cache of `_deps` (plan ci-cache):
    #  - Under CMake 4 (CMP0168 is NEW) FetchContent keeps its "already cloned" stamps in <tree>/CMakeFiles/fc-stamp and
    #    fc-tmp, not in _deps, so restoring _deps alone still clones all seven. A hit therefore configures with
    #    FETCHCONTENT_FULLY_DISCONNECTED=ON (below): nothing is downloaded or updated, and the restored sources are trusted.
    #  - The .git directories are left out of the saved entry. They are 436 of the 473 MB (405 of the compressed MB), and
    #    nothing reads them on a hit. The last step of the job deletes them, because a pattern in `path` cannot: the action
    #    hands tar the _deps directory itself, and tar takes everything under it (run 41879448286 saved 407 MB with a
    #    `!` pattern there).
    #
    # Because the restored sources are trusted, the key covers everything that can change what is in them: the toolchain
    # (the build outputs are in the tree too), and every file that pins a dependency. There are two, CMakeLists.txt and
    # tests/CMakeLists.txt. test_ci_cache_key fails when a file that declares a dependency is missing from the list, and
    # reads the key from its one line, so keep it on one line ending in hashFiles(...).
    #
    # Deliberately no restore-keys: a partial match would restore the sources of other pins. Assumes the fixed workspace
    # path of the ccache step.
    - name: Cache third-party dependencies
      id: deps
      uses: actions/cache@v6
      with:
        path: ${{github.workspace}}/build/${{env.PRESET}}/_deps
        key: deps-${{runner.os}}-${{runner.arch}}-${{env.PRESET}}-${{steps.toolchain.outputs.id}}-${{hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt')}}

    # ccache covers what costs: 98% of the build is compiling (plan ci-cache). Its entries are content-addressed over the
    # compiler, its flags and the preprocessed source, so a stale or foreign entry just misses and cannot be wrong; that is
    # why restore-keys is safe here. The commit in the key makes every run save its own snapshot, and the restore-keys pick
    # up the most recent earlier one: the latest of the same toolchain first, and then, when a run lands on the other CMake
    # of the afternoon, the latest of any. Degrades to a no-op on a miss.
    #
    # This assumes a fixed workspace path, /home/runner/work/cryptocogs/cryptocogs, which ccache hashes into its entries.
    # It holds on hosted runners and would not under a container or a self-hosted runner.
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{runner.os}}-${{env.PRESET}}-${{steps.toolchain.outputs.id}}-${{github.sha}}
        restore-keys: |
          ccache-${{runner.os}}-${{env.PRESET}}-${{steps.toolchain.outputs.id}}-
          ccache-${{runner.os}}-${{env.PRESET}}-

    - name: Configure CMake
      # Through the preset, which names the tree and sets CMAKE_BUILD_TYPE and nothing else, so the launcher is CI's own.
      # On a hit of the dependency cache it also stops FetchContent from downloading anything (see that step).
      run: >
        cmake --preset ${{env.PRESET}}
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        ${{ steps.deps.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }}

    - name: Build
      # -j: the build is compile-bound. In run 41852041317, 401 of the 408 s were compiles and 6.5 s were links, and
      # building serially left every core but one idle. nproc is echoed so that the runner's core count stays a
      # measurement and not an assumption (plan ci-cache).
      #
      # ccache: the first line says where the cache lives and how large it may grow (never a failure if ccache words it
      # differently). -z zeroes the counters, so that -s after the build reports this build's hits and misses, and the size
      # of the cache that the post step of the Cache ccache step is about to save.
      run: |
        echo "runner cores: $(nproc)"
        ccache --show-config | grep -E 'cache_dir|max_size' || true
        ccache -z
        cmake --build --preset ${{env.PRESET}} -j $(nproc)
        ccache -s

    - name: Test
      # The test preset carries --output-on-failure, and fails a run that finds no tests.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --preset ${{env.PRESET}}

    # The post action of Cache third-party dependencies saves _deps after this step, and only when the cache missed. Without
    # the .git directories the entry is tens of MB and not 407 (see that step). The tree is discarded with the job, and a
    # failed job saves nothing, so nothing is lost by deleting them last.
    - name: Drop the dependencies' .git directories
      if: steps.deps.outputs.cache-hit != 'true'
      run: rm -rf ${{github.workspace}}/build/${{env.PRESET}}/_deps/*-src/.git
