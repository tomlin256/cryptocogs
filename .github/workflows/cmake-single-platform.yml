# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Manual trigger: a cache can only be measured by a second run on an unchanged tree, and that should not cost a
  # junk commit (plan 030).
  workflow_dispatch:

env:
  # CI's platform is Linux on x86_64, built as Release. The preset (CMakePresets.json) names the tree,
  # build/release-linux-x86_64, and sets its build type; a runner of another architecture fails at the
  # Configure step, and the build-tree guard in CMakeLists.txt says which preset to use (plan 028).
  PRESET: release-linux-x86_64

jobs:
  build:
    # The configure, build and test commands are the same on any platform, through the presets.
    # You can convert this to a matrix build if you need cross-platform coverage: one preset per leg.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # libcurl4-openssl-dev only suggests the other two on Ubuntu, so all three are named.
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev

    # Which CMake and which compiler the runner has. The floor (CMake 4.0) and the standard (C++23) of plan 029 are only
    # as good as the image, so the log says what ran before Configure, which stops on either.
    - name: Tool versions
      run: |
        cmake --version | head -1
        c++ --version | head -1

    - name: Configure CMake
      run: cmake --preset ${{env.PRESET}}

    - name: Build
      # -j: the build is compile-bound. In run 41852041317, 401 of the 408 s were compiles and 6.5 s were links, and
      # building serially left every core but one idle. nproc is echoed so that the runner's core count stays a
      # measurement and not an assumption (plan 030).
      run: |
        echo "runner cores: $(nproc)"
        cmake --build --preset ${{env.PRESET}} -j $(nproc)

    - name: Test
      # The test preset carries --output-on-failure, and fails a run that finds no tests.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --preset ${{env.PRESET}}
